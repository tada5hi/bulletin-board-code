<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="t d">
<title id="t">Bulletin Board Code</title>
<desc id="d">A note pinned to a bulletin board carries the BBCode tag b in square brackets.</desc>
<style>
:root{--a:#9c5c9d;--b:#d88c38;--ink:#253447;--paper:#ffffff;--line:#8394a7;--back:#e6d3e6}
@media(prefers-color-scheme:dark){:root{--a:#c48ac5;--b:#e9a35a;--ink:#e4ebf3;--paper:#1f2c3d;--line:#8495aa;--back:#4a3050}}
</style>
<rect x="52" y="64" width="168" height="152" rx="14" fill="var(--back)" transform="rotate(8 136 140)"/>
<g transform="rotate(-6 128 136)">
<rect x="44" y="60" width="168" height="152" rx="14" fill="var(--paper)" stroke="var(--line)" stroke-width="4"/>
<text x="128" y="162" fill="var(--a)" font-size="68" font-weight="700" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">[b]</text>
<path d="M76 188H180" stroke="var(--line)" stroke-width="5" stroke-linecap="round" opacity=".55"/>
</g>
<circle cx="124" cy="58" r="17" fill="var(--b)"/>
<circle cx="119" cy="53" r="5" fill="#ffffff" opacity=".6"/>
</svg>
