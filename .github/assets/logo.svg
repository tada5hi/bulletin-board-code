<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="bulletin-board-code-a-title bulletin-board-code-a-desc">
<title id="bulletin-board-code-a-title">Bulletin Board Code — Reversible markup</title>
<desc id="bulletin-board-code-a-desc">Square BBCode brackets and HTML angle brackets face each other around reversible conversion arrows.</desc>
<style>
:root{--accent:#9c5c9d;--second:#d88c38;--ink:#253447;--paper:#f7fafc;--line:#8394a7;--wash:#9c5c9d18}
@media(prefers-color-scheme:dark){:root{--ink:#e4ebf3;--paper:#182332;--line:#8495aa;--wash:#9c5c9d22}}
.a{stroke:var(--accent)}.b{stroke:var(--second)}.af{fill:var(--accent)}.bf{fill:var(--second)}.ink{fill:var(--ink)}.paper{stroke:var(--line)}.line{stroke:var(--line)}.wash{fill:var(--wash)}.white{fill:#fff}.neutral{fill:var(--paper)}
</style>
